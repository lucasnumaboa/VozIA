<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — VozIA</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d0d;
      font-family: 'Segoe UI', sans-serif;
      color: #e0e0e0;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 40px 36px;
      width: 340px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo img  { width: 72px; height: 72px; object-fit: contain; }
    .logo h1 { font-size: 1.2rem; font-weight: 600; margin-top: 10px; color: #fff; }
    .logo p  { font-size: 0.8rem; color: #666; margin-top: 4px; }
    label { display: block; font-size: 0.8rem; color: #888; margin-bottom: 6px; }
    input[type=text], input[type=password] {
      width: 100%;
      padding: 10px 14px;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 0.95rem;
      outline: none;
      transition: border-color .2s;
      margin-bottom: 18px;
    }
    input:focus { border-color: #4f8ef7; }
    .btn {
      width: 100%;
      padding: 11px;
      background: #4f8ef7;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    .btn:hover { background: #3a7de0; }
    .error {
      background: #3a1212;
      border: 1px solid #7a2020;
      color: #ff7070;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
      margin-bottom: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="/static/icon.png" alt="VozIA" />
      <h1>VozIA</h1>
      <p>Faça login para continuar</p>
    </div>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/login">
      <label for="username">Usuário</label>
      <input type="text" id="username" name="username" autocomplete="username" required />
      <label for="password">Senha</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required />
      <button class="btn" type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
